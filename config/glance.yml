# Nord Newsroom — Glance starter configuration
# 5 pages, curated political perspectives, engineering, AI, home automation, science, crops and energy.
# Import into Glance, or try with the unofficial Glance Chrome new-tab extension.
# Some feeds may block third-party readers or require a refresh.

server:
  proxied: true

document:
  head: |
    <style>
      .theme-preset[data-key="default-light"] { display: none; }
    </style>

auth:
  secret-key: ${secret:glance_auth_secret_key}
  users:
    ${secret:glance_auth_username}:
      password-hash: ${secret:glance_auth_password_hash}

branding:
  logo-text: S
  app-name: My Glance
  hide-footer: true
theme:
  background-color: 220 16 22
  primary-color: 193 44 67
  positive-color: 92 28 65
  negative-color: 354 42 57
  contrast-multiplier: 1.2
  presets:
    nord-light:
      light: true
      background-color: 218 27 94
      primary-color: 213 30 52
      positive-color: 92 25 40
      negative-color: 354 43 50
pages:
  - name: Today
    head-widgets:
      - type: search
        search-engine: duckduckgo
        autofocus: false
      - type: rss
        title: Headlines across perspectives
        style: horizontal-cards
        limit: 12
        collapse-after: 8
        cache: 1h
        feeds:
          - url: https://feeds.bbci.co.uk/news/world/rss.xml
            title: BBC World
            limit: 3
          - url: https://flipboard.com/@associatedpress/top-stories-u7govdf1z.rss
            title: Associated Press (via Flipboard)
            limit: 3
          - url: https://www.theguardian.com/us-news/rss
            title: Guardian US
            limit: 3
          - url: https://www.nationalreview.com/feed/
            title: National Review
            limit: 3
          - url: https://grist.org/feed/
            title: Grist
            limit: 3
          - url: https://www.quantamagazine.org/feed/
            title: Quanta Magazine
            limit: 3
    columns:
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday
          - type: rss
            title: World briefing
            style: vertical-list
            limit: 9
            collapse-after: 5
            cache: 1h
            feeds:
              - url: https://feeds.bbci.co.uk/news/world/rss.xml
                title: BBC World
                limit: 3
              - url: https://flipboard.com/@associatedpress/top-stories-u7govdf1z.rss
                title: Associated Press (via Flipboard)
                limit: 3
              - url: https://news.google.com/rss/search?q=when:24h+site:reuters.com&hl=en-US&gl=US&ceid=US:en
                title: Reuters (via Google News)
                limit: 3
      - size: full
        widgets:
          - type: rss
            title: Engineering + AI
            style: detailed-list
            limit: 12
            collapse-after: 6
            cache: 1h
            feeds:
              - url: https://tldr.tech/api/rss/tech
                title: TLDR Tech
                limit: 3
              - url: https://tldr.tech/api/rss/webdev
                title: TLDR Web Dev
                limit: 3
              - url: https://tldr.tech/api/rss/ai
                title: TLDR AI
                limit: 3
              - url: https://simonwillison.net/atom/everything/
                title: Simon Willison
                limit: 3
          - type: rss
            title: Science + climate
            style: horizontal-cards
            limit: 12
            collapse-after: 6
            cache: 1h
            feeds:
              - url: https://www.quantamagazine.org/feed/
                title: Quanta Magazine
                limit: 3
              - url: https://www.sciencedaily.com/rss/top/science.xml
                title: "ScienceDaily: Top Science"
                limit: 3
              - url: https://e360.yale.edu/feed.xml
                title: Yale Environment 360
                limit: 3
              - url: https://news.mongabay.com/feed/
                title: Mongabay
                limit: 3
      - size: small
        widgets:
          - type: rss
            title: Smart home
            style: vertical-list
            limit: 9
            collapse-after: 5
            cache: 1h
            feeds:
              - url: https://www.home-assistant.io/atom.xml
                title: Home Assistant Blog
                limit: 3
              - url: https://smarthomescene.com/feed/
                title: SmartHomeScene
                limit: 3
              - url: https://selfh.st/rss/
                title: selfh.st
                limit: 3
          - type: rss
            title: Off-grid + growing
            style: vertical-list
            limit: 9
            collapse-after: 5
            cache: 1h
            feeds:
              - url: https://solar.lowtechmagazine.com/feeds/all.rss.xml
