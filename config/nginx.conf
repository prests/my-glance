server {
    listen      8080;
    server_name _;

    location = /healthz {
        access_log off;
        proxy_pass http://glance:8080/login;
    }

    location = /feeds/news.opml {
        alias        /usr/share/nginx/html/feeds/news.opml;
        default_type application/xml;
        add_header   Cache-Control "public, max-age=1800, immutable" always;
        add_header   Content-Disposition "attachment; filename=\"news.opml\""
          always;
        add_header   X-Content-Type-Options nosniff always;

        limit_except GET {
            deny all;
        }
    }

    location / {
        proxy_pass         http://glance:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host $host;
        # cloudflared supplies CF-Connecting-IP. Replace untrusted client XFF entirely.
        proxy_set_header   X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header   X-Real-IP $http_cf_connecting_ip;
    }
}
