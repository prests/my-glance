services:
  glance:
    build:
      context: .
    image: ${GLANCE_IMAGE:-prests/my-glance:local}
    restart: unless-stopped
    secrets:
      - glance_auth_username
      - glance_auth_password_hash
      - glance_auth_secret_key
    networks:
      - dashboard

  nginx:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    depends_on:
      - glance
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dashboard
      - tunnel
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

secrets:
  glance_auth_username:
    environment: GLANCE_AUTH_USERNAME
  glance_auth_password_hash:
    environment: GLANCE_AUTH_PASSWORD_HASH
  glance_auth_secret_key:
    environment: GLANCE_AUTH_SECRET_KEY

networks:
  dashboard:
  tunnel:
